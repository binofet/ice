<div id="join"><input id="name" aria-label="Your name" placeholder="Your name" maxlength="20" pattern="[A-Za-z0-9 _.-]{1,20}" autocomplete="nickname"><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" aria-label="Pairing code" placeholder="Pairing code"><button id="connect">Join table</button></div>
<div id="room" hidden><strong id="round">Lobby</strong><ul id="players" aria-label="Players and scores"></ul><div id="actions"><button id="start" hidden>Start round</button><button id="leave">Leave table</button></div></div>
<div id="meter" hidden>Aim left or right</div><div id="pad" hidden><div id="fill"></div><div id="hint">DRAG UP</div></div><small>Five balls each · take turns · keep this page open</small>
<script>
'use strict';
const $=id=>document.getElementById(id), status=$('status'),pad=$('pad');
let joined=false,canShoot=false,contact=null,startY=0,power=0,aim=0,began=0,seq=0,turn=0,armedTurn=0,sending=false,polling=false,timer;
$('code').value=/^#[0-9]{6}$/.test(location.hash)?location.hash.slice(1):'';$('code').hidden=!!$('code').value;
function cancel(){contact=null;power=0;$('fill').style.height='0%';}
function disconnected(text){joined=canShoot=false;cancel();status.textContent=text;$('join').hidden=false;$('room').hidden=true;pad.hidden=true;$('meter').hidden=true;}
async function post(path,body){return fetch(path,{method:'POST',headers:{'Content-Type':'text/plain'},body,signal:AbortSignal.timeout(1500)});}
function show(s){
 joined=true;canShoot=s.canShoot&&s.state==='connected';turn=s.turn;seq=Math.max(seq,s.nextSequence-1);if(!canShoot||armedTurn!==turn)cancel();
 $('join').hidden=true;$('room').hidden=false;$('start').hidden=!s.canStart;$('start').textContent=s.phase==='results'?'Play again':'Start round';
 $('round').textContent=s.phase==='lobby'?'Players at the table':s.phase==='results'?'Round complete':`Round ${s.round}`;
 const current=s.players.find(p=>p.id===s.current),leader=s.players.find(p=>p.id===s.leader);
 status.textContent=s.state==='pairing'?'Connecting to game…':s.phase==='lobby'?(s.canStart?'Ready? Start when everyone has joined.':`Waiting for ${leader?.name||'the host'} to start.`):s.phase==='results'?'Scores are in. Play again when ready.':canShoot?'Your turn — drag up to roll.':s.current===s.me?'Wait for the ball or game to be ready.':`${current?.name||'Another player'}’s turn.`;
 $('players').replaceChildren(...s.players.map(p=>{const li=document.createElement('li');li.className=(p.id===s.current?'current ':'')+(p.id===s.me?'me':'');const name=document.createElement('span'),score=document.createElement('span');name.textContent=p.name+(p.id===s.me?' (you)':'')+(!p.online?' · offline':p.waiting&&s.phase==='playing'?' · next round':'');score.textContent=`${p.score} · ${p.balls}/5`;li.append(name,score);return li;}));
 pad.hidden=s.phase!=='playing';$('meter').hidden=pad.hidden;pad.classList.toggle('waiting',!canShoot);$('hint').textContent=canShoot?'DRAG UP\n\nRelease to roll':'WAITING FOR YOUR TURN';
}
async function poll(){if(polling||document.hidden)return;polling=true;try{const r=await fetch('/status',{cache:'no-store',signal:AbortSignal.timeout(1500)});if(r.status===401){clearInterval(timer);disconnected('Enter your name to join the table.');return;}show(await r.json());}catch{canShoot=false;cancel();status.textContent='Connection lost. Reconnecting…';}finally{polling=false;}}
function watch(){clearInterval(timer);timer=setInterval(poll,400);poll();}
$('connect').onclick=async()=>{cancel();seq=0;const name=$('name').value.trim();if(!/^[A-Za-z0-9 _.-]{1,20}$/.test(name)){status.textContent='Use a short name with letters or numbers.';return;}$('connect').disabled=true;try{const r=await post('/join',`${$('code').value}\n${name}`);if(!r.ok){disconnected(r.status===409?'The table is full.':'Check the pairing code and try again.');return;}show(await r.json());watch();}catch{disconnected('Could not reach the game.');}finally{$('connect').disabled=false;}};
$('start').onclick=async()=>{cancel();try{const r=await post('/start','');if(!r.ok)status.textContent='Only the table leader can start the next round.';await poll();}catch{status.textContent='Could not start. Try again.';}};
$('leave').onclick=()=>{cancel();clearInterval(timer);navigator.sendBeacon('/leave','');disconnected('You left the table. Join again when ready.');};
document.addEventListener('visibilitychange',()=>{cancel();if(!document.hidden&&joined)poll();});window.addEventListener('pagehide',cancel);
pad.addEventListener('pointerdown',e=>{if(!canShoot||contact!==null||sending)return;contact=e.pointerId;armedTurn=turn;pad.setPointerCapture(contact);startY=e.clientY;began=performance.now();power=0;update(e);});
function update(e){if(e.pointerId!==contact)return;const r=pad.getBoundingClientRect();aim=Math.max(-1,Math.min(1,(e.clientX-r.left)/r.width*2-1));power=Math.max(0,Math.min(1,(startY-e.clientY)/r.height*1.8));$('fill').style.height=`${power*100}%`;$('meter').textContent=`Power ${Math.round(power*100)}% · Aim ${Math.round(aim*100)}%`;}
pad.addEventListener('pointermove',update);pad.addEventListener('pointercancel',cancel);pad.addEventListener('lostpointercapture',cancel);
pad.addEventListener('pointerup',async e=>{if(e.pointerId!==contact)return;update(e);let a=aim,p=power,age=performance.now()-began,t=armedTurn;cancel();if(p<.03||age>8000||!canShoot||t!==turn||sending)return;sending=true;canShoot=false;try{const r=await post('/shot',`${++seq} ${t} ${a} ${p}`);status.textContent=r.ok?'Shot sent':'Wait for your turn and a ready ball.';}catch{status.textContent='No confirmation. The shot may have arrived.';}finally{sending=false;}});
watch();
</script></html>
