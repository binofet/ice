<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="referrer" content="no-referrer"><title>ICE Controller</title>
<style>
:root{color-scheme:dark;font:18px system-ui;background:#07121e;color:#effaff}body{margin:0;padding:max(20px,env(safe-area-inset-top)) 24px max(20px,env(safe-area-inset-bottom));height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;max-width:650px;margin:auto}h1{font-size:26px;margin:0}p{margin:0;color:#b7cbd8}button,input{font:inherit;border-radius:12px;padding:14px;border:1px solid #527487;background:#133447;color:inherit}input{width:7ch;letter-spacing:.12em}#join{display:flex;gap:12px}#pad{flex:1;min-height:160px;position:relative;display:grid;place-items:center;text-align:center;background:#102d3e;border:1px solid #345d72;border-radius:24px;touch-action:none;user-select:none}#fill{position:absolute;bottom:0;width:100%;background:#41bcaa44;pointer-events:none;border-radius:24px}#hint{position:relative;pointer-events:none;white-space:pre-line}#status{min-height:1.5em}#leave{display:none}#meter{font-size:24px;font-variant-numeric:tabular-nums}small{color:#94b0c0}
</style>
<h1>SkeeBall Controller</h1><p id="status" role="status">Enter the code shown on the game.</p><div id="join"><input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" aria-label="Pairing code" placeholder="Code"><button id="connect">Join game</button></div><button id="leave">Disconnect</button><div id="meter">Aim left or right</div><div id="pad"><div id="fill"></div><div id="hint">DRAG UP\n\nRelease to roll</div></div><small>Touch controller · keep this page open</small>
<script>
'use strict';
const $=id=>document.getElementById(id), status=$('status'), pad=$('pad');
let connected=false, contact=null, startY=0, power=0, aim=0, began=0, seq=0, sending=false, polling=false, timer;
$('code').value=/^#[0-9]{6}$/.test(location.hash)?location.hash.slice(1):'';
function cancel(){contact=null;power=0;$('fill').style.height='0%';}
function state(active,text){connected=active;status.textContent=text;$('connect').disabled=text.startsWith('Connecting');$('join').style.display=active?'none':'flex';$('leave').style.display=active?'block':'none';if(!active)cancel();}
async function post(path,body){return fetch(path,{method:'POST',headers:{'Content-Type':'text/plain'},body,signal:AbortSignal.timeout(1500)});}
async function poll(){if(polling||document.hidden)return;polling=true;try{const r=await fetch('/status',{cache:'no-store',signal:AbortSignal.timeout(1500)});if(r.status===401){state(false,'Join the game to play.');return;}const s=await r.json();state(s.state==='connected',s.state==='connected'?(s.message||'Connected to game'):s.state==='pairing'?'Connecting…':'Disconnected. Join again.');}catch{state(false,'Connection lost. Join again.');}finally{polling=false;}}
$('connect').onclick=async()=>{cancel();seq=0;try{const r=await post('/join',$('code').value);if(!r.ok){state(false,r.status===409?'A controller is already connected.':'Check the pairing code.');return;}state(false,'Connecting…');clearInterval(timer);timer=setInterval(poll,400);await poll();}catch{state(false,'Could not reach the game.');}};
function leave(){cancel();connected=false;clearInterval(timer);navigator.sendBeacon('/leave','');state(false,'Disconnected. Join again to play.');}
$('leave').onclick=leave;document.addEventListener('visibilitychange',()=>{if(document.hidden)leave();});window.addEventListener('pagehide',leave);
pad.addEventListener('pointerdown',e=>{if(!connected||contact!==null||sending)return;contact=e.pointerId;pad.setPointerCapture(contact);startY=e.clientY;began=performance.now();power=0;update(e);});
function update(e){if(e.pointerId!==contact)return;const r=pad.getBoundingClientRect();aim=Math.max(-1,Math.min(1,(e.clientX-r.left)/r.width*2-1));power=Math.max(0,Math.min(1,(startY-e.clientY)/r.height*1.8));$('fill').style.height=`${power*100}%`;$('meter').textContent=`Power ${Math.round(power*100)}% · Aim ${Math.round(aim*100)}%`;}
pad.addEventListener('pointermove',update);pad.addEventListener('pointercancel',cancel);pad.addEventListener('lostpointercapture',cancel);
pad.addEventListener('pointerup',async e=>{if(e.pointerId!==contact)return;update(e);let a=aim,p=power,age=performance.now()-began;cancel();if(p<.03||age>8000||!connected||sending)return;sending=true;try{const r=await post('/shot',`${++seq} ${a} ${p}`);status.textContent=r.ok?'Shot sent':r.status===409?'Game not ready. Try your next shot.':'Reconnect to the game.';}catch{status.textContent='No confirmation. The shot may have arrived.';}finally{sending=false;}});
$('hint').textContent='DRAG UP\n\nRelease to roll';
</script></html>
