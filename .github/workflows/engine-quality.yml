name: Engine quality
on: [push, pull_request]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        cpp: [20, 23]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang-18 libx11-dev libgl-dev libgl1-mesa-dri xvfb xauth
      - name: Pinned quality tools
        run: python -m pip install -r Tools/Quality/requirements.txt
      - name: Metagen consumer cache integrity
        run: python Tools/MetagenIntegration/check.py --cached-only
      - name: Optional RTTR integration
        run: |
          cmake -S Tools/MetagenIntegration/native -B build/metagen-ci -DICE_METAGEN_RTTR=ON -DICE_CXX_STANDARD=${{ matrix.cpp }}
          cmake --build build/metagen-ci --parallel 4
          if ! ctest --test-dir build/metagen-ci --output-on-failure; then
            if [ "$RUNNER_OS" = macOS ]; then
              lldb --batch -o run -k 'thread backtrace all' -- build/metagen-ci/meta_graph_tests Tools/MetagenIntegration/Generated || true
            fi
            exit 1
          fi
      - name: Rust serialization consumer
        env:
          RUSTUP_TOOLCHAIN: '1.90.0'
        run: |
          rustup toolchain install 1.90.0 --profile minimal --no-self-update
          python Tools/MetagenIntegration/check_rust.py --native-build build/metagen-ci
      - name: Configure
        run: cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DICE_WARNINGS_AS_ERRORS=ON -DICE_CXX_STANDARD=${{ matrix.cpp }}
      - name: Build public headers, engine modules and tests
        run: cmake --build build/ci --parallel 4
      - name: Regression tests
        run: ctest --test-dir build/ci --output-on-failure
      - name: Formatting
        run: python Tools/Quality/check.py format --all
      - name: Public API documentation and argument contracts
        run: python Tools/Quality/api.py --build-dir build/ci
      - name: Static analysis
        run: python Tools/Quality/check.py lint --build-dir build/ci
      - name: Linux native window and software GPU checks
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          LANG=C.UTF-8 XMODIFIERS=@im=none xvfb-run -a build/ci/ice_platform_input_x11_tests
          xvfb-run -a build/ci/bin/ice_window_smoke
          xvfb-run -a build/ci/bin/ice_gl_tests tests/data/gl
          xvfb-run -a build/ci/bin/ice_render_switch_tests tests/data
          xvfb-run -a build/ci/bin/ice_live_pipeline_tests
          xvfb-run -a build/ci/bin/ice_mesh_tests tests/data/mesh
  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure headless runtime with address and undefined-behavior checks
        run: >-
          cmake -S . -B build/sanitizers -DCMAKE_BUILD_TYPE=Debug
          -DICE_CXX_STANDARD=23 -DICE_ENABLE_SANITIZERS=ON
          -DICE_BUILD_DESKTOP=OFF -DICE_BUILD_METAL=OFF -DICE_BUILD_OPENGL=OFF
          -DICE_BUILD_COMPANION=OFF -DICE_BUILD_TOOLS=OFF
      - name: Build
        run: cmake --build build/sanitizers --parallel 4
      - name: Memory and ownership regressions
        run: ctest --test-dir build/sanitizers --output-on-failure
