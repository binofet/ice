name: Engine quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ice-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }} / optimized C++${{ matrix.cpp }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os: [ubuntu-24.04, macos-15]
        cpp: [20, 23]
    defaults:
      run:
        shell: bash
    env:
      CI_CPP: ${{ matrix.cpp }}
      CI_PROFILE: native
      CI_EVIDENCE_DIR: ${{ github.workspace }}/build/ci-evidence
      LIBGL_ALWAYS_SOFTWARE: '1'
      LP_NUM_THREADS: '4'
    steps:
      - name: Check out exact event commit, without private submodules
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: false

      - name: Identify exact tested source, head and base
        run: python3 tools/ci/report.py init --profile native

      - name: Python for pinned tools and cached consumers
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Evidence helper regressions
        run: python3 tools/ci/run_stage.py evidence -- python3 tools/ci/test_evidence.py

      - name: Trusted gate contract regressions
        run: python3 tools/ci/run_stage.py gate-contract -- python3 tools/ci/github/test_gate.py

      - name: Lowercase project directory policy
        if: ${{ !cancelled() }}
        run: python3 tools/ci/run_stage.py path-policy -- python3 tools/ci/check_paths.py

      - name: Linux GCC and native Mesa development libraries
        id: linux_dependencies
        if: runner.os == 'Linux'
        run: |
          python3 tools/ci/run_stage.py dependencies -- bash -euo pipefail -c '
            sudo apt-get update
            sudo apt-get install -y g++-13 clang-18 libx11-dev libgl-dev libopengl-dev libegl-dev \
              libgles-dev libgl1-mesa-dri xvfb xauth mesa-utils libasound2-dev libpulse-dev
            echo CC=gcc-13 >> "$GITHUB_ENV"
            echo CXX=g++-13 >> "$GITHUB_ENV"
            g++-13 --version
            cmake --version
          '

      - name: macOS native toolchain
        id: mac_dependencies
        if: runner.os == 'macOS'
        run: |
          python3 tools/ci/run_stage.py dependencies -- bash -euo pipefail -c '
            xcodebuild -version
            xcrun clang++ --version
            cmake --version
          '

      - name: Pinned quality tools
        id: quality_tools
        run: python3 tools/ci/run_stage.py quality-tools -- python3 -m pip install -r tools/quality/requirements.txt

      - name: Public cached Metagen consumer integrity (no private credentials)
        if: ${{ !cancelled() }}
        run: python3 tools/ci/run_stage.py consumer-cache -- python3 tools/metagenintegration/check.py --cached-only

      - name: Configure optional public RTTR consumer
        id: metagen_configure
        if: ${{ !cancelled() }}
        run: |
          python3 tools/ci/run_stage.py metagen-configure -- cmake \
            -S tools/metagenintegration/native -B build/metagen-ci \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DICE_METAGEN_RTTR=ON -DICE_WARNINGS_AS_ERRORS=ON -DICE_CXX_STANDARD="$CI_CPP"

      - name: Build optional RTTR and serialization consumers
        id: metagen_build
        if: ${{ !cancelled() && steps.metagen_configure.outcome == 'success' }}
        run: python3 tools/ci/run_stage.py metagen-build -- cmake --build build/metagen-ci --parallel 4

      - name: Discover optional consumer CTests
        if: ${{ !cancelled() && steps.metagen_build.outcome == 'success' }}
        run: python3 tools/ci/run_stage.py metagen-discovery -- ctest --test-dir build/metagen-ci --show-only=json-v1

      - name: Optional consumer regressions with measured JUnit
        if: ${{ !cancelled() && steps.metagen_build.outcome == 'success' }}
        run: |
          python3 tools/ci/run_stage.py metagen -- ctest --test-dir build/metagen-ci \
            --output-on-failure --parallel 2 --timeout 120 --no-tests=error \
            --test-output-size-passed 4096 --test-output-size-failed 16384 \
            --output-junit "$CI_EVIDENCE_DIR/metagen.xml"

      - name: Pinned Rust serialization consumer
        if: ${{ !cancelled() && steps.metagen_build.outcome == 'success' }}
        env:
          RUSTUP_TOOLCHAIN: '1.90.0'
        run: |
          python3 tools/ci/run_stage.py rust -- bash -euo pipefail -c '
            rustup toolchain install 1.90.0 --profile minimal --no-self-update
            python3 tools/metagenintegration/check_rust.py --native-build build/metagen-ci
          '

      - name: Configure strict optimized engine, public headers and all tests
        id: configure
        if: ${{ !cancelled() }}
        run: |
          python3 tools/ci/run_stage.py configure -- cmake -S . -B build/ci \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DICE_WARNINGS_AS_ERRORS=ON -DICE_CXX_STANDARD="$CI_CPP" \
            -DICE_BUILD_GLES=OFF -DICE_BUILD_AUDIO_PLAYBACK=ON \
            -DPython3_EXECUTABLE="$(command -v python3)"

      - name: Build engine modules, public headers and tests
        id: build
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: python3 tools/ci/run_stage.py build -- cmake --build build/ci --parallel 4

      - name: Discover actual CPU test inventory
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 tools/ci/run_stage.py cpu-discovery -- ctest --test-dir build/ci --show-only=json-v1

      - name: CPU regressions with measured JUnit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 tools/ci/run_stage.py cpu -- ctest --test-dir build/ci \
            --output-on-failure --parallel 4 --timeout 180 --no-tests=error \
            --test-output-size-passed 4096 --test-output-size-failed 16384 \
            --output-junit "$CI_EVIDENCE_DIR/cpu.xml"

      - name: Pinned formatting
        if: ${{ !cancelled() && steps.quality_tools.outcome == 'success' }}
        run: python3 tools/ci/run_stage.py format -- python3 tools/quality/check.py format --all

      - name: Public API documentation and argument contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.quality_tools.outcome == 'success' }}
        run: python3 tools/ci/run_stage.py api -- python3 tools/quality/api.py --build-dir build/ci

      - name: Pinned static analysis
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.quality_tools.outcome == 'success' }}
        run: |
          python3 tools/ci/run_stage.py lint -- bash -euo pipefail -c '
            python3 tools/quality/check.py lint --build-dir build/ci
            python3 tools/quality/check.py lint --build-dir build/ci --files \
              engine/src/audio/playback.cpp engine/src/audio/wav.cpp \
              tests/audio_playback.cpp tests/audio_wav.cpp
          '

      # Each executable gets its own result, deadline and JUnit case. One failure
      # must not hide independent native, HDR, textured or skinning regressions.
      - name: Actual Linux X11 and software OpenGL, including HDR
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.build.outcome == 'success' }}
        run: python3 tools/ci/render_checks.py --build build/ci

      - name: Configure separate headless EGL GLES profile
        id: gles_configure
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          python3 tools/ci/run_stage.py gles-configure -- cmake -S . -B build/gles-ci \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DICE_WARNINGS_AS_ERRORS=ON -DICE_CXX_STANDARD="$CI_CPP" \
            -DICE_BUILD_DESKTOP=OFF -DICE_BUILD_METAL=OFF -DICE_BUILD_OPENGL=OFF \
            -DICE_BUILD_GLES=ON -DICE_BUILD_COMPANION=OFF -DICE_BUILD_TOOLS=OFF \
            -DICE_BUILD_PHYSICS_2D=OFF -DICE_BUILD_PHYSICS_3D=OFF \
            -DICE_BUILD_SCRIPTING=OFF -DICE_BUILD_AUDIO=OFF -DICE_BUILD_COMMANDS=OFF

      - name: Build GLES library, borrowed-target tests and public headers
        id: gles_build
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.gles_configure.outcome == 'success' }}
        run: |
          python3 tools/ci/run_stage.py gles-build -- cmake --build build/gles-ci \
            --parallel 4 --target ice_gles_tests ice_acquisition_lease_tests ice_public_headers

      - name: Discover exact EGL GLES and lease inventory
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.gles_build.outcome == 'success' }}
        run: |
          python3 tools/ci/run_stage.py gles-discovery -- ctest --test-dir build/gles-ci \
            --show-only=json-v1 -R '^ice_(gles|acquisition_lease)$'

      - name: Actual surfaceless Mesa GLES and borrowed-target lease execution
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.gles_build.outcome == 'success' }}
        env:
          EGL_PLATFORM: surfaceless
        run: |
          python3 tools/ci/run_stage.py gles -- ctest --test-dir build/gles-ci \
            -R '^ice_(gles|acquisition_lease)$' --verbose --timeout 180 --no-tests=error \
            --test-output-size-passed 4096 --test-output-size-failed 16384 \
            --output-junit "$CI_EVIDENCE_DIR/gles.xml"

      - name: Finalize exact-source, inventory, per-case timings and coverage report
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: python3 tools/ci/report.py summary

      - name: Upload project evidence even after failures
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ice-${{ matrix.os }}-cpp${{ matrix.cpp }}-${{ github.sha }}-${{ github.run_attempt }}
          path: build/ci-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Verify provider upload receipt and finalization
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          python3 tools/ci/report.py publication \
            --artifact-id '${{ steps.upload.outputs.artifact-id }}' \
            --artifact-url '${{ steps.upload.outputs.artifact-url }}' \
            --outcome '${{ steps.upload.outcome }}'

  sanitizers:
    name: Ubuntu / scoped ASan+UBSan C++23
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CI_CPP: '23'
      CI_PROFILE: sanitizers
      CI_EVIDENCE_DIR: ${{ github.workspace }}/build/ci-evidence
      CC: gcc-13
      CXX: g++-13
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      # Match discovery, target build and execution. This is deliberately not GPU CI.
      CI_SANITIZER_TESTS: '^ice_(host_runtime|input_actions|commands|data_graph|data_json|character3d|physics3d|static_collision3d|script_lua|audio_capture|recording_store|audio_wav|audio_playback)$'
    steps:
      - name: Check out exact event commit, without private submodules
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false
          submodules: false

      - name: Identify exact tested source, head and base
        run: python3 tools/ci/report.py init --profile sanitizers

      - name: Evidence helper regressions
        run: python3 tools/ci/run_stage.py evidence -- python3 tools/ci/test_evidence.py

      - name: Trusted gate contract regressions
        run: python3 tools/ci/run_stage.py gate-contract -- python3 tools/ci/github/test_gate.py

      - name: Native sanitizer compiler
        run: |
          python3 tools/ci/run_stage.py dependencies -- bash -euo pipefail -c '
            sudo apt-get update
            sudo apt-get install -y g++-13 libasound2-dev libpulse-dev
            g++-13 --version
            cmake --version
          '

      - name: Configure headless ownership regressions
        id: configure
        if: ${{ !cancelled() }}
        run: |
          python3 tools/ci/run_stage.py configure -- cmake -S . -B build/sanitizers \
            -DCMAKE_BUILD_TYPE=Debug -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DICE_CXX_STANDARD=23 -DICE_ENABLE_SANITIZERS=ON -DICE_WARNINGS_AS_ERRORS=ON \
            -DICE_BUILD_DESKTOP=OFF -DICE_BUILD_METAL=OFF -DICE_BUILD_OPENGL=OFF \
            -DICE_BUILD_GLES=OFF -DICE_BUILD_COMPANION=OFF -DICE_BUILD_TOOLS=OFF \
            -DICE_BUILD_PHYSICS_2D=OFF -DICE_BUILD_AUDIO_PLAYBACK=ON

      - name: Build only selected sanitizer regressions and their dependencies
        id: build
        if: ${{ !cancelled() && steps.configure.outcome == 'success' }}
        run: |
          python3 tools/ci/run_stage.py build -- cmake --build build/sanitizers --parallel 4 \
            --target ice_host_tests ice_input_action_tests ice_command_tests \
            ice_data_graph_tests ice_data_json_tests ice_character3d_tests ice_physics3d_tests \
            ice_static_collision3d_tests ice_script_lua_tests ice_audio_capture_tests ice_recording_store_tests \
            ice_audio_wav_tests ice_audio_playback_tests

      - name: Discover exact sanitizer test inventory
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 tools/ci/run_stage.py cpu-discovery -- ctest --test-dir build/sanitizers \
            --show-only=json-v1 -R "$CI_SANITIZER_TESTS"

      - name: Scoped memory and ownership regressions with measured JUnit
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 tools/ci/run_stage.py cpu -- ctest --test-dir build/sanitizers \
            -R "$CI_SANITIZER_TESTS" --output-on-failure --parallel 2 --timeout 180 --no-tests=error \
            --test-output-size-passed 4096 --test-output-size-failed 16384 \
            --output-junit "$CI_EVIDENCE_DIR/cpu.xml"

      - name: Finalize scoped sanitizer evidence
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: python3 tools/ci/report.py summary

      - name: Upload scoped evidence even after failures
        id: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ice-sanitizers-cpp23-${{ github.sha }}-${{ github.run_attempt }}
          path: build/ci-evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Verify provider upload receipt and finalization
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          python3 tools/ci/report.py publication \
            --artifact-id '${{ steps.upload.outputs.artifact-id }}' \
            --artifact-url '${{ steps.upload.outputs.artifact-url }}' \
            --outcome '${{ steps.upload.outcome }}'
