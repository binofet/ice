# Install only after reviewing the controller on each repository's default branch.
# This job never checks out/imports PR-head source. Root enables required contexts.
name: Family trusted gate
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: [Engine quality, Family review signal]
    types: [completed]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write
concurrency:
  group: family-gate-${{ github.repository }}
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'binofet/ice'
    runs-on: [self-hosted, Linux, X64, "${{ github.event.repository.name }}.control"]
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
    timeout-minutes: 15
    steps:
      - name: Check out only current trusted default-branch controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          submodules: false
      - name: Verify preprovisioned owned control runtime
        run: |
          /opt/ice-family-ci/toolchains/native-20261018-v1/bin/python3.12 -c 'import platform,sys; (sys.version_info[:3] == (3,12,15) and platform.system() == "Linux" and platform.machine().lower() in ("x86_64","amd64")) or sys.exit("Owned Linux/X64 Python3.12.15 is required"); print(platform.platform()); print(platform.machine())'
          /usr/bin/git --version
          /usr/bin/gh --version
      - name: Authenticate current PR, review, tested merge and actual artifact uploads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$GH_TOKEN"
          /opt/ice-family-ci/toolchains/native-20261018-v1/bin/python3.12 tools/ci/github/gate.py refresh --repo "$GITHUB_REPOSITORY" --publish
