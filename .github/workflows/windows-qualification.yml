name: Windows native qualification

on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: 'Reviewed master dispatch-snapshot SHA for Windows CPU qualification'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ice-windows-qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-qualification:
    name: Windows / native C++23 qualification
    if: >-
      github.repository == 'binofet/ice' && github.event.repository.id == 40782766 &&
      github.event.repository.fork == false && github.event_name == 'workflow_dispatch' &&
      github.actor == 'binofet' && github.run_attempt == 1 &&
      github.event.repository.default_branch == 'master' && github.ref == 'refs/heads/master' &&
      inputs.expected_head == github.sha
    runs-on: [self-hosted, Windows, X64, spacegoo.windows.ice.qualify]
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CI_WINDOWS_TOOL_ROOT: 'C:\ProgramData\ICE-Family-CI\toolchains\windows-native-20261026-v1'
      CMAKE_BUILD_PARALLEL_LEVEL: '4'
      GIT_TERMINAL_PROMPT: '0'
      GIT_CONFIG_COUNT: '2'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
      GIT_CONFIG_KEY_1: core.autocrlf
      GIT_CONFIG_VALUE_1: 'false'
    steps:
      - name: Check out the exact admitted default-head commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
          set-safe-directory: false
          submodules: false

      - name: Record exact source and require the provisioned Windows profile
        run: |
          $ErrorActionPreference = 'Stop'
          if ($PSVersionTable.PSVersion -lt [version]'7.6.5') { throw 'PowerShell 7.6.5 or later required' }
          if (-not $IsWindows -or -not [Environment]::Is64BitProcess -or $env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') { throw 'Observed Windows/X64 runtime required' }
          if ($env:RUNNER_NAME -ne 'spacegoo-windows-ice-cpu-001') { throw 'Unexpected qualification runner' }
          $evidence = Join-Path $env:GITHUB_WORKSPACE 'build/ci-windows-evidence'
          if (Test-Path -LiteralPath $evidence) { throw 'Refusing prior qualification evidence' }
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GITHUB_SHA) { throw 'Checkout/event source mismatch' }
          $dirty = & git status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Tracked source checkout is incomplete or changed' }
          $tree = (& git rev-parse 'HEAD^{tree}').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Source tree identity unavailable' }
          @{format='ice-windows-qualification-v1'; tested_commit=$actual; tested_tree=$tree; run_id=$env:GITHUB_RUN_ID; run_attempt=$env:GITHUB_RUN_ATTEMPT; runner=$env:RUNNER_NAME; scope='native compile and CPU-labelled CTests; no GPU or interactive input'} | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $evidence 'source.json')
          $root = $env:CI_WINDOWS_TOOL_ROOT
          $python = Join-Path $root 'python-3.14.8/python.exe'
          $cmake = Join-Path $root 'cmake-4.2.3/bin/cmake.exe'
          $ctest = Join-Path $root 'cmake-4.2.3/bin/ctest.exe'
          $ninja = Join-Path $root 'ninja-1.13.2/ninja.exe'
          foreach ($path in @($root, $python, $cmake, $ctest, $ninja)) {
            $item = Get-Item -LiteralPath $path
            if ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw "Reparse tool path: $path" }
          }
          # The separate host admission verifies the complete protected tool tree
          # and isolated service account. This job never installs or repairs it.
          $vswhere = 'C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -version '[18.11,18.12)' -property installationPath | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $vs -or $vs.Contains("`n")) { throw 'Exactly one supported VS instance required' }
          $vcvars = Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat'
          $command = 'call "' + $vcvars + '" >nul && set'
          $lines = & 'C:\Windows\System32\cmd.exe' /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'MSVC developer environment failed' }
          $selected = @('PATH','INCLUDE','LIB','LIBPATH','VCToolsVersion','VCToolsInstallDir','WindowsSDKVersion','WindowsSdkDir','UniversalCRTSdkDir','UCRTVersion')
          foreach ($line in $lines) {
            $split = $line.IndexOf('=')
            if ($split -lt 1) { continue }
            $key = $line.Substring(0,$split)
            if ($key -in $selected) { [Environment]::SetEnvironmentVariable($key,$line.Substring($split+1),'Process') }
          }
          if ($env:VCToolsVersion.TrimEnd('\') -ne '14.51.36231' -or $env:WindowsSDKVersion.TrimEnd('\') -ne '10.0.26100.0') { throw 'MSVC/SDK differs from the provisioned profile' }
          $env:PATH = (Split-Path $python) + ';' + (Split-Path $cmake) + ';' + (Split-Path $ninja) + ';' + $env:PATH
          $PSNativeCommandUseErrorActionPreference = $false
          $compiler = (& cl /Bv 2>&1 | Out-String)
          if ($LASTEXITCODE -notin @(0,2) -or $compiler.Length -gt 16384 -or $compiler -notmatch '\b19\.51\.36260\b') { throw 'Compiler identity differs' }
          $PSNativeCommandUseErrorActionPreference = $true
          $cmakeVersion = (& $cmake --version | Out-String).Trim()
          $ctestVersion = (& $ctest --version | Out-String).Trim()
          $ninjaVersion = (& $ninja --version | Out-String).Trim()
          if ($cmakeVersion -notmatch '^cmake version 4\.2\.3\b' -or $ctestVersion -notmatch '^ctest version 4\.2\.3\b' -or $ninjaVersion -ne '1.13.2') { throw 'CMake/CTest/Ninja profile mismatch' }
          & $python -I -B -c 'import platform,sys; assert sys.version_info[:3]==(3,14,8) and sys.platform=="win32" and sys.maxsize>2**32; print(sys.version); print(platform.machine())'
          foreach ($key in $selected) {
            $value = [Environment]::GetEnvironmentVariable($key,'Process')
            if ($null -ne $value) {
              if ($value.Contains("`n") -or $value.Contains("`r")) { throw 'Multiline environment value rejected' }
              [IO.File]::AppendAllText($env:GITHUB_ENV,"$key=$value`n",[Text.UTF8Encoding]::new($false))
            }
          }
          @{profile='windows-native-20261026-v1'; cmake=$cmakeVersion; ctest=$ctestVersion; ninja=$ninjaVersion; compiler=$compiler; tool_hashes=@($python,$cmake,$ctest,$ninja | ForEach-Object { Get-FileHash -Algorithm SHA256 -LiteralPath $_ | Select-Object Path,Hash })} | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 (Join-Path $evidence 'toolchain.json')

      - name: Configure strict native Win32 engine and CPU tests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S . -B build/windows-cpp23 -G Ninja '-DCMAKE_BUILD_TYPE=RelWithDebInfo' '-DBUILD_TESTING=ON' '-DICE_CXX_STANDARD=23' '-DICE_WARNINGS_AS_ERRORS=ON' '-DICE_BUILD_DESKTOP=ON' '-DICE_BUILD_OPENGL=ON' '-DICE_BUILD_METAL=OFF' '-DICE_BUILD_VULKAN=OFF' '-DICE_BUILD_GLES=OFF' '-DICE_BUILD_COMPANION=OFF' '-DICE_BUILD_TOOLS=OFF' 2>&1 | Tee-Object -FilePath build/ci-windows-evidence/configure.log

      - name: Compile and link native targets with four workers
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build build/windows-cpp23 --parallel 4 2>&1 | Tee-Object -FilePath build/ci-windows-evidence/build.log

      - name: Discover and execute actual CPU-labelled CTests
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ctest --test-dir build/windows-cpp23 -L cpu --show-only=json-v1 | Set-Content -Encoding utf8 build/ci-windows-evidence/ctest-inventory.json
          $inventory = Get-Content -Raw build/ci-windows-evidence/ctest-inventory.json | ConvertFrom-Json
          if (@($inventory.tests).Count -eq 0) { throw 'No CPU-labelled tests discovered' }
          ctest --test-dir build/windows-cpp23 -L cpu --output-on-failure --parallel 2 --timeout 180 --no-tests=error --test-output-size-passed 4096 --test-output-size-failed 16384 --output-junit "$env:GITHUB_WORKSPACE/build/ci-windows-evidence/cpu.xml" 2>&1 | Tee-Object -FilePath build/ci-windows-evidence/cpu.log

      - name: Retain actual Windows source, tool, compile and CPU evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ice-windows-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/ci-windows-evidence/
          if-no-files-found: error
          overwrite: false
          include-hidden-files: false
          archive: true
